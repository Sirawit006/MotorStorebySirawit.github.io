<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/css/register.css">
</head>
<body>
    <div class="register-card">
        <div class="back">
            <p><a href="/">< Back</a></p>
        </div>
        <h2>Register</h2>
        <form action="/register" method="post">
            <div class="input-info">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter new username" required>
            </div>
            <div class="input-info">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="input-info">
                <label for="phone-number">Phone number</label>
                <input type="text" id="phone-number" name="phone-number" placeholder="Enter your phone number" required>
            </div>
            <div class="input-info">
                <label for="password">Password</label>
                <input type="password" id="password" name="username" placeholder="Enter new password" required>
            </div>
            <div class="input-info">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-username" placeholder="Enter confirm password" required>
            </div>
            <button type="submit" class="register-bt">Register</button>
        </form>
        <p>i have an acount <a href="/login">login</a></p>
    </div>
</body>
</html>
